<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM | שלמה וקסלר - ייעוץ משכנתאות</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">ש.ו</span>
      <div>
        <h1>שלמה וקסלר</h1>
        <small>ייעוץ משכנתאות · מערכת ניהול לקוחות</small>
      </div>
    </div>
    <nav id="nav">
      <button data-view="dashboard" class="active">לוח בקרה</button>
      <button data-view="clients">לקוחות</button>
      <button data-view="pipeline">תהליכים</button>
      <button data-view="tasks">משימות</button>
      <button data-view="calculator">מחשבון</button>
      <button data-view="settings">גיבוי</button>
    </nav>
  </header>

  <main id="app"></main>

  <dialog id="modal">
    <form method="dialog" id="modal-form">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button type="submit" value="save" class="primary">שמירה</button>
        <button type="submit" value="cancel" formnovalidate>ביטול</button>
      </div>
    </form>
  </dialog>

  <script src="js/storage.js"></script>
  <script src="js/mortgage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
